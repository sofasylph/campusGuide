<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Campus Guide v2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-sized stage, centred. Each screen is a full-height column: headline top, one choice, main action in the bottom third. */
:root{
  --violet:#7B61FF; --indigo:#2A1A6E; --ink:#1D1638; --muted:#6B6485;
  --lilac:#DCD0F8; --paper:#F6F3EC; --card:#FFFFFF; --grey:#CFCBC2;
  --pink:#F7C3D6; --sky:#BFE3F5; --yellow:#FFE27A; --white:#FFFFFF;
  --stage:#E9E4F7; --stage-fg:#4A4370;
  --font:'Poppins','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --stage:#17122B; --stage-fg:#B9B0DC; color-scheme:dark } }
:root[data-theme="dark"]{ --stage:#17122B; --stage-fg:#B9B0DC; color-scheme:dark }

html,body{height:100%}
body{background:var(--stage);color:var(--stage-fg);font-family:var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-inline:16px;padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}

.phone{position:relative;width:min(390px,100%);height:min(800px,100%);flex:1 1 auto;max-height:800px;background:var(--paper);color:var(--ink);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;transition:background .35s ease}
.proto-note{font-size:12px;margin:0;text-align:center}
@media (max-width:480px){ body{padding-inline:0;padding-block:0} .phone{border-radius:0;max-height:none;height:100%} .proto-note{display:none} }

.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px;flex:0 0 auto}
.back{width:44px;height:44px;border-radius:50%;font-size:26px;line-height:1;color:inherit}
.exit{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--indigo);color:var(--white);font-size:13px;font-weight:500}
.scr{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:16px;padding:8px 22px 18px;overflow-y:auto;animation:fadeUp .32s ease both}
.strip{flex:0 0 auto;background:var(--lilac);color:var(--indigo);font-size:12px;text-align:center;padding:9px 12px}
h1{font-size:30px;line-height:1.14;font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0;line-height:1.5}
.sub{color:var(--muted);font-size:14px}
.pill{display:block;width:100%;min-height:54px;border-radius:999px;background:var(--indigo);color:var(--white);font-size:16px;font-weight:600;padding:0 20px}
.pill.ghost{background:transparent;color:var(--indigo);box-shadow:inset 0 0 0 2px var(--indigo)}
.pill[disabled]{opacity:.35;cursor:default}
.link{font-size:14px;color:inherit;text-decoration:underline;text-underline-offset:3px;padding:10px;align-self:center}
.push{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--grey);color:var(--ink);border-radius:6px;padding:2px 6px;vertical-align:middle}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{transform:translateY(760px)}to{transform:none}}
@keyframes bob{0%,100%{transform:translateY(-3px)}50%{transform:translateY(4px)}}
@keyframes drift{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
@keyframes jitter{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-1px)}}
@keyframes sink{0%,100%{transform:translateY(0)}50%{transform:translateY(6px) scaleY(.98)}}
@keyframes twist{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes doze{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}40%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
@keyframes redraw{to{stroke-dashoffset:-56}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.55}}
@keyframes drop{0%{transform:translate(-50%,-190%) scale(.9);opacity:0}60%{transform:translate(-50%,-44%) scale(1.04);opacity:1}78%{transform:translate(-50%,-54%) rotate(-5deg)}100%{transform:translate(-50%,-50%)}}
@keyframes settle{from{opacity:0}to{opacity:1}}

/* characters */
.ch{display:block;width:100%;height:auto;overflow:visible}
.ch .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.idle-sunny{animation:bob 3.2s ease-in-out infinite}
.idle-foggy{animation:drift 6.5s ease-in-out infinite}
.idle-buzzy{animation:jitter .38s ease-in-out infinite}
.idle-heavy{animation:sink 5.2s ease-in-out infinite}
.idle-knotted{animation:twist 4.2s ease-in-out infinite}
.idle-sleepy{animation:doze 5s ease-in-out infinite}
.ch .z{animation:zz 3s ease-out infinite}
.ch .z2{animation-delay:1.5s}
.ch .outline{animation:redraw 3s linear infinite}

/* 1 arrival */
.phone[data-bg="violet"]{background:var(--violet);color:var(--white)}
.phone[data-bg="pink"]{background:var(--pink)}
.phone[data-bg="sky"]{background:var(--sky)}
.phone[data-bg="yellow"]{background:var(--yellow)}
.phone[data-bg="lilac"]{background:var(--lilac)}
.phone[data-bg="white"]{background:var(--white)}
.arrive{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;overflow:hidden}
.arrive h1{font-size:40px;position:relative;z-index:3}
.arrive .sub{color:var(--white);opacity:.9;position:relative;z-index:3}
.arrive .pill{background:var(--white);color:var(--indigo);max-width:240px;margin-top:18px;position:relative;z-index:3}
.dot{width:16px;height:16px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 6px rgba(123,97,255,.22);flex:0 0 auto}
.arrive .dot{background:var(--white);box-shadow:0 0 0 7px rgba(255,255,255,.28);animation:pulse 2.4s ease-in-out infinite;margin-bottom:8px;position:relative;z-index:3}
.clouds{position:absolute;left:-10%;right:-10%;bottom:-70px;height:170px;z-index:2}
.clouds i{position:absolute;bottom:0;border-radius:50%;background:var(--lilac)}
.riser{position:absolute;z-index:1;animation:rise 1.1s cubic-bezier(.2,.8,.3,1) both}

/* 2 intro */
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--grey)}
.dots i.on{background:var(--violet);width:22px;border-radius:8px}
.pic{background:var(--lilac);border-radius:28px;aspect-ratio:1/0.82;max-width:100%;display:grid;place-items:center;overflow:hidden}
.pic svg{width:100%;height:100%}
.roll{animation:roll 2.4s ease-in-out both}
@keyframes roll{0%{transform:translate(0,0)}35%{transform:translate(70px,-34px)}70%{transform:translate(20px,-78px)}100%{transform:translate(96px,-112px)}}
.win{animation:light 1.6s ease .5s both}
@keyframes light{from{fill:#B9A8EE}to{fill:#FFE27A}}
.fold{transform-box:fill-box;transform-origin:center bottom;animation:foldaway 2.2s ease .4s both}
@keyframes foldaway{0%{transform:none}35%{transform:scaleY(.66)}65%{transform:scaleY(.36)}100%{transform:scaleY(.36) translateY(190px)}}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;background:var(--card);font-size:13px;font-weight:500;color:var(--ink)}
.chip.on{background:var(--indigo);color:var(--white)}

/* 3 ways */
.way{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:104px;border-radius:26px;padding:16px 20px;text-align:left;color:var(--ink);animation:fadeUp .4s ease both;transition:transform .2s ease}
.way:active{transform:scale(1.03)}
.way b{font-size:20px;font-weight:600;display:block;line-height:1.2}
.way>span>span{font-size:13px;color:var(--muted)}
.way svg{width:64px;height:64px;flex:0 0 auto;transition:transform .3s ease}
.way:hover svg,.way:active svg{transform:rotate(-6deg) scale(1.08)}

/* 4 check-in */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:22px;padding:10px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;line-height:1.25;color:var(--ink);text-align:center;transition:transform .25s ease,opacity .25s ease,box-shadow .25s ease;min-height:150px}
.tile .holder{width:92px;height:101px;display:grid;place-items:end center}
.grid.has-pick .tile:not(.on){opacity:.5}
.tile.on{transform:translateY(-5px);box-shadow:inset 0 0 0 3px var(--indigo)}
.tile.wide{grid-column:1/-1;flex-direction:row;justify-content:center;min-height:64px;background:var(--grey);gap:12px;font-size:14px}
.tile.wide .holder{width:44px;height:44px}

/* 5 plate */
.plate{position:relative;width:min(230px,70%);aspect-ratio:1;margin:0 auto;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 16px #EFEAE0;flex:0 0 auto}
.tok{position:absolute;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transform:translate(-50%,-50%);animation:drop .7s cubic-bezier(.3,.9,.4,1) both;color:var(--ink)}
.tok svg,.card-opt svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card-opt{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border-radius:18px;background:var(--card);font-size:14px;font-weight:500;color:var(--ink);text-align:left}
.card-opt.on{background:var(--indigo);color:var(--white)}
.else{width:100%;min-height:48px;border-radius:16px;border:2px solid var(--indigo);background:var(--card);padding:0 14px;font:inherit;font-size:14px;color:var(--ink)}

/* 6 chat */
.chatbar{display:flex;align-items:center;gap:8px;padding:0 0 6px}
.chatbar .me{width:46px;height:51px}
.minitok{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.minitok svg{width:14px;height:14px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.log{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-start;animation:fadeUp .35s ease both}
.msg .dot{margin-top:14px;width:12px;height:12px;box-shadow:0 0 0 4px rgba(123,97,255,.2)}
.msg .dot.writing{animation:pulse 1.3s ease-in-out infinite}
.bubble{background:var(--card);border-radius:20px;padding:12px 15px;font-size:14.5px;line-height:1.5;min-width:0}
.msg.me{justify-content:flex-end}
.msg.me .bubble{background:var(--indigo);color:var(--white)}
.excard{display:flex;align-items:center;gap:12px;background:var(--sky);border-radius:18px;padding:12px;margin:10px 0 2px;width:100%;text-align:left;color:var(--ink)}
.excard .me{width:54px;height:59px;flex:0 0 auto}
.excard b{display:block;font-size:14.5px}
.excard>span>span{font-size:12.5px;color:var(--muted);display:block}
.note{background:transparent;border:2px dashed var(--grey);border-radius:18px;padding:12px 14px;font-size:13px;color:var(--muted);animation:fadeUp .35s ease both}
.replies{display:flex;flex-direction:column;gap:8px}
.replies .pill{min-height:48px;font-size:14.5px;font-weight:500}

/* 7 breathe */
.breath{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0}
.ringwrap{position:relative;width:min(280px,78%);aspect-ratio:1;display:grid;place-items:center}
.ringwrap>svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap circle{fill:none;stroke-width:5}
.ringwrap .track{stroke:rgba(42,26,110,.15)}
.ringwrap .prog{stroke:var(--indigo);stroke-linecap:round;stroke-dasharray:741;stroke-dashoffset:741}
.breather{width:52%;transform:scale(.92);transition:transform 1s ease}
.breather .eyes{animation:none;transition:transform 1.2s ease}
.breather.out .eyes{transform:scaleY(.12)}
.plainblob{width:100%;aspect-ratio:1;border-radius:50%;background:var(--violet)}
.word{font-size:34px;font-weight:600;min-height:44px;color:var(--indigo)}
.two{display:flex;gap:10px}
.two .pill{flex:1}


/* ===================== v2 additions ===================== */
:root{ --muted-on:#4A4366; --night:#1D1638 }
/* contrast fixes */
.way>span>span,.excard>span>span{color:var(--muted-on)}
.arrive .sub{opacity:1;font-size:19px;font-weight:600;line-height:1.3;max-width:290px}
.phone[data-bg="pink"] .sub,.phone[data-bg="sky"] .sub,.phone[data-bg="yellow"] .sub,.phone[data-bg="lilac"] .sub,.phone[data-bg="lime"] .sub{color:var(--muted-on)}
.phone[data-bg="lime"]{background:#C6E58A}
.phone[data-bg="night"]{background:var(--night);color:#fff}

/* top bar: sound */
.bar .right{display:flex;align-items:center;gap:8px}
.snd{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(42,26,110,.1);color:var(--indigo);transition:background .2s,color .2s}
.snd svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.snd[aria-pressed="true"]{background:var(--indigo);color:#fff}
.snd .wave{opacity:0;transition:opacity .2s}.snd[aria-pressed="true"] .wave{opacity:1}.snd[aria-pressed="true"] .mute{opacity:0}

/* shared */
.toast{position:absolute;left:16px;right:16px;bottom:16px;z-index:30;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.45;animation:toastIn .3s ease both;box-shadow:0 10px 30px rgba(29,22,56,.25)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tag.sample{background:var(--white);color:var(--indigo)}
.phone[data-bg="paper"] .tag.sample{background:var(--lilac)}
.progress{height:6px;border-radius:6px;background:rgba(42,26,110,.14);overflow:hidden;flex:0 0 auto}
.progress i{display:block;height:100%;background:var(--indigo);border-radius:6px;transition:width .45s ease}
.kicker{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--indigo)}
.why{font-size:12.5px;color:var(--muted-on);line-height:1.45}
.qopts{display:flex;flex-direction:column;gap:8px}
.qopt{min-height:52px;border-radius:18px;background:var(--card);padding:12px 16px;text-align:left;font-size:14.5px;font-weight:500;color:var(--ink);transition:background .2s,color .2s,transform .15s;animation:fadeUp .35s ease both}
.qopt.on{background:var(--indigo);color:#fff}
.qopt:active{transform:scale(.98)}
.qopt small{display:block;font-size:12.5px;font-weight:400;opacity:.8;margin-top:2px}
.field{width:100%;min-height:52px;border-radius:16px;border:2px solid var(--indigo);background:var(--card);padding:12px 14px;font:inherit;font-size:14.5px;color:var(--ink);resize:none}
textarea.field{min-height:96px;line-height:1.5}
.row{display:flex;gap:8px;align-items:center}
.row .field{flex:1}
.sq{min-width:52px;height:52px;border-radius:16px;background:var(--indigo);color:#fff;font-size:22px;font-weight:600}
.panel{background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;animation:fadeUp .35s ease both}
.panel h2{font-size:17px;margin:0;font-weight:600}
.sec{font-size:13px;font-weight:600;color:var(--ink);margin-top:4px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;font-size:14px;text-align:left;width:100%;color:var(--ink)}
.switch i{width:44px;height:26px;border-radius:999px;background:var(--grey);position:relative;flex:0 0 auto;transition:background .2s}
.switch i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,.9,.4,1)}
.switch[aria-pressed="true"] i{background:var(--indigo)}
.switch[aria-pressed="true"] i:after{transform:translateX(18px)}

/* mode */
.mode{display:flex;flex-direction:column;gap:6px;width:100%;border-radius:26px;padding:18px 20px;text-align:left;color:var(--ink);background:var(--card);animation:fadeUp .4s ease both;box-shadow:inset 0 0 0 0 var(--indigo);transition:box-shadow .2s,transform .2s}
.mode{position:relative;padding-right:60px;cursor:pointer;box-shadow:0 3px 0 rgba(42,26,110,.12),inset 0 0 0 2px rgba(42,26,110,.16)}
.mode:hover{box-shadow:0 4px 0 rgba(42,26,110,.16),inset 0 0 0 2px rgba(42,26,110,.34)}
.mode:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(42,26,110,.12),inset 0 0 0 2px rgba(42,26,110,.34)}
.mode .rd{position:absolute;top:20px;right:18px;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--indigo);display:grid;place-items:center}
.mode.on .rd{background:var(--indigo)}
.mode.on .rd:after{content:"";width:11px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.mode.on{box-shadow:0 3px 0 rgba(42,26,110,.2),inset 0 0 0 3px var(--indigo);transform:translateY(-3px)}
.mode b{font-size:19px;font-weight:600}
.mode span{font-size:13px;color:var(--muted);line-height:1.45}
.mode .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:4px}
.mode .ic svg{width:24px;height:24px;fill:none;stroke:var(--indigo);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* map / know */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{border-radius:22px;padding:14px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--ink);animation:fadeUp .4s ease both;transition:transform .2s}
.mt:active{transform:scale(.97)}
.mt b{font-size:15px;line-height:1.25;font-weight:600}
.mt small{font-size:12px;color:var(--muted-on);line-height:1.35}
.mt svg{width:34px;height:34px;fill:none;stroke:var(--indigo);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mt.wide{grid-column:1/-1;min-height:72px;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
.need{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:58px;border-radius:18px;background:var(--card);padding:0 16px;text-align:left;font-size:14.5px;font-weight:500;color:var(--ink);animation:fadeUp .35s ease both}
.need:after{content:"\203A";font-size:24px;color:var(--indigo)}

/* library */
.lib{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lcard{border-radius:22px;padding:8px 8px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--ink);animation:fadeUp .4s ease both;transition:transform .2s}
.lcard:active{transform:scale(.97)}
.lcard .mini{border-radius:16px;aspect-ratio:300/246;overflow:hidden;background:rgba(255,255,255,.55)}
.lcard .mini svg{width:100%;height:100%;display:block}
.lcard b{font-size:14px;line-height:1.25;padding:0 4px}
.lcard small{font-size:11.5px;color:var(--muted-on);padding:0 4px}
.chips-row{display:flex;gap:6px;flex-wrap:wrap}
.chips-row .chip{min-height:44px;font-size:13px}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.meta span{font-size:12px;font-weight:500;background:rgba(255,255,255,.75);border-radius:999px;padding:4px 10px;color:var(--ink)}
.evid{background:rgba(255,255,255,.75);border-radius:18px;padding:12px 14px;font-size:12.5px;line-height:1.45;color:var(--ink)}
.evid b{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--indigo);margin-bottom:2px}
.pic.big{aspect-ratio:300/246}

/* runner common */
.stepdots{display:flex;gap:5px;justify-content:center}
.stepdots i{width:7px;height:7px;border-radius:50%;background:rgba(42,26,110,.22);transition:all .3s}
.stepdots i.on{width:20px;border-radius:7px;background:var(--indigo)}
.stepdots i.done{background:var(--indigo)}
.bigword{font-size:30px;font-weight:600;color:var(--indigo);text-align:center;min-height:40px}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.hint{font-size:13px;color:var(--muted-on);text-align:center}

/* PMR */
.pmr-wrap{position:relative;width:min(240px,64%);margin:4px auto 0;aspect-ratio:1;display:grid;place-items:center}
.pmr-wrap .halo{position:absolute;inset:8%;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(.9);transition:transform 1.2s ease,background 1.2s ease}
.pmr-wrap.release .halo{transform:scale(1.08);background:rgba(255,255,255,.7)}
.pmr-me{position:relative;width:70%;transition:transform 1.4s ease}
.pmr-me .eyes{animation:none;transition:transform .8s ease}
.pmr-wrap.tense .pmr-me{animation:tense .45s ease-in-out infinite}
.pmr-wrap.release .pmr-me .eyes{transform:scaleY(.12)}
@keyframes tense{0%,100%{transform:scale(1.05,.9)}50%{transform:scale(1.07,.88) rotate(1.2deg)}}
.parts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.parts i{font-style:normal;font-size:12px;font-weight:500;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.6);color:var(--ink);transition:all .3s}
.parts i.on{background:var(--indigo);color:#fff;transform:translateY(-2px)}
.parts i.done{background:var(--card);color:var(--muted-on)}
.meter{width:min(240px,70%);height:8px;border-radius:8px;background:rgba(42,26,110,.14);overflow:hidden;margin:0 auto}
.meter i{display:block;height:100%;width:0;background:var(--indigo);border-radius:8px}

/* grounding */
.ground{position:relative;width:min(250px,70%);aspect-ratio:1;margin:0 auto;display:grid;place-items:center}
.ground .rip{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(42,26,110,.25);animation:ripple 3.6s ease-out infinite}
.ground .rip:nth-child(2){animation-delay:1.2s}.ground .rip:nth-child(3){animation-delay:2.4s}
@keyframes ripple{from{transform:scale(.35);opacity:1}to{transform:scale(1.05);opacity:0}}
.ground .core{width:46%;position:relative}
.senses{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:6px 0}
.sense{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 2px rgba(42,26,110,.28);display:grid;place-items:center;transition:transform .35s cubic-bezier(.3,.9,.4,1),background .3s,box-shadow .3s;font-size:12px;font-weight:600;color:var(--indigo)}
.sense.on{transform:scale(1.12);box-shadow:none;color:var(--ink)}
.sense svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.feet{display:flex;gap:16px;justify-content:center;align-items:flex-end;height:120px}
.foot{width:46px;height:96px;border-radius:24px 24px 22px 22px;background:var(--indigo);animation:press 2.4s ease-in-out infinite;transform-origin:bottom}
.foot:last-child{animation-delay:.3s}
@keyframes press{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.9)}}
.floor{height:10px;border-radius:10px;background:rgba(42,26,110,.25);width:min(220px,64%);margin:0 auto}

/* parking lot */
.lot{position:relative;background:#3B3360;border-radius:24px;height:200px;overflow:hidden;flex:0 0 auto}
.lot .bay{position:absolute;top:0;bottom:30px;width:33.33%;border-right:3px dashed rgba(255,255,255,.35)}
.lot .bay:nth-child(3){border-right:0}
.lot .lab{position:absolute;bottom:0;height:30px;width:33.33%;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.18)}
.lot .gate{position:absolute;left:50%;top:-12px;width:80px;height:24px;margin-left:-40px;border-radius:0 0 14px 14px;background:rgba(255,255,255,.12)}
.car{position:absolute;width:58px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.car:before,.car:after{content:"";position:absolute;bottom:-5px;width:12px;height:8px;border-radius:4px;background:#1D1638}
.car:before{left:8px}.car:after{right:8px}
.car.new{animation:park 1s cubic-bezier(.3,.8,.3,1) both}
@keyframes park{from{transform:translate(var(--fx),var(--fy)) rotate(var(--fr))}70%{transform:translate(0,-6px) rotate(2deg)}to{transform:none}}
.car.wait{animation:idlecar 1.6s ease-in-out infinite}
@keyframes idlecar{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.worry{background:var(--card);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;animation:fadeUp .35s ease both}
.worry p{font-size:14px;font-weight:500;display:flex;gap:8px;align-items:center}
.worry .num{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto}
.bays{display:flex;gap:6px;flex-wrap:wrap}
.bays .chip{min-height:44px;font-size:12.5px;background:var(--paper)}
.bays .chip.on{background:var(--indigo)}

/* activity menu & timer */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{border-radius:18px;padding:12px;text-align:left;color:var(--ink);min-height:74px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s,box-shadow .2s;animation:fadeUp .35s ease both}
.cat.on{box-shadow:inset 0 0 0 3px var(--indigo);transform:translateY(-2px)}
.cat b{font-size:14px}.cat small{font-size:11.5px;color:var(--muted-on)}
.dur{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dur button{min-height:64px;border-radius:18px;background:var(--card);font-size:13px;color:var(--ink);font-weight:500}
.dur button b{display:block;font-size:20px}
.dur button.on{background:var(--indigo);color:#fff}
.tring{position:relative;width:min(240px,66%);aspect-ratio:1;margin:0 auto;display:grid;place-items:center}
.tring>svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.tring circle{fill:none;stroke-width:8}
.tring .track{stroke:rgba(42,26,110,.15)}
.tring .prog{stroke:var(--indigo);stroke-linecap:round;stroke-dasharray:741;stroke-dashoffset:741;transition:stroke-dashoffset 1s linear}
.tring .t{font-size:40px;font-weight:600;color:var(--indigo);position:relative;font-variant-numeric:tabular-nums}
.tring .me{position:absolute;width:38%;bottom:-6%;right:-4%}

/* coping card */
.cc-stage{perspective:900px;width:100%;max-width:300px;margin:0 auto}
.cc{position:relative;width:100%;aspect-ratio:1.45;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.8,.3,1)}
.cc.flip{transform:rotateY(180deg)}
.cc .face{position:absolute;inset:0;border-radius:24px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;backface-visibility:hidden;-webkit-backface-visibility:hidden;color:var(--ink);box-shadow:0 14px 30px rgba(42,26,110,.15)}
.cc .face-b{transform:rotateY(180deg)}
.cc .face q{font-size:19px;font-weight:600;line-height:1.3;quotes:none}
.cc .face small{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-on)}
.cc.build{animation:ccIn .7s cubic-bezier(.3,.9,.4,1) both}
@keyframes ccIn{from{opacity:0;transform:translateY(40px) rotate(-6deg) scale(.9)}to{opacity:1;transform:none}}
.swatches{display:flex;gap:10px;justify-content:center}
.swatches button{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(42,26,110,.15)}
.swatches button.on{box-shadow:inset 0 0 0 3px var(--indigo)}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;animation:spark .9s ease-out forwards;z-index:5}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--sx),var(--sy)) scale(.2);opacity:0}}

/* SFN */
.box3{display:flex;flex-direction:column;gap:8px}
.box3 .b{background:var(--card);border-radius:18px;padding:12px 14px;animation:fadeUp .4s ease both}
.box3 .b small{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--indigo)}
.box3 .b p{font-size:14.5px;margin-top:2px}
.draft{background:var(--card);border-radius:18px;padding:14px;font-size:14.5px;line-height:1.5;border:2px dashed var(--indigo)}

/* break it down */
.stairs{position:relative;height:150px;flex:0 0 auto}
.stairs .s{position:absolute;bottom:0;width:20%;border-radius:12px 12px 0 0;background:var(--indigo);transform-origin:bottom;animation:grow .6s cubic-bezier(.3,.9,.4,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.stairs .hop{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 6px rgba(123,97,255,.22);transition:left .5s ease,bottom .5s cubic-bezier(.3,1.6,.5,1)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px;font-size:14px;text-align:left;color:var(--ink);animation:fadeUp .35s ease both;transition:background .2s,color .2s}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto}
.step.on{background:var(--indigo);color:#fff}.step.on .n{background:#fff;color:var(--indigo)}
.plan{background:var(--card);border-radius:22px;padding:16px;font-size:16px;line-height:1.6;font-weight:500}
.plan .blank{display:inline-block;background:var(--yellow);border-radius:8px;padding:0 6px;font-weight:600}
.pickrow{display:flex;gap:6px;flex-wrap:wrap}
.pickrow .chip{min-height:44px}

/* check-in after activity */
.reply-card{background:var(--card);border-radius:20px;padding:14px 16px;font-size:14.5px;line-height:1.5;display:flex;gap:10px;animation:fadeUp .35s ease both}
.reply-card .dot{margin-top:6px;width:12px;height:12px;box-shadow:0 0 0 4px rgba(123,97,255,.2)}

/* next step */
.nextcard{position:relative;border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:10px;color:var(--ink);animation:fadeUp .45s ease both}
.nextcard h2{font-size:22px;margin:0;font-weight:600;line-height:1.2}
.nextcard p{font-size:14px}
.nextcard .me{position:absolute;top:-22px;right:10px;width:72px}
.nextcard h2{padding-right:70px}
.opt-list{display:flex;flex-direction:column;gap:8px}
.optl{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;border-radius:18px;background:var(--card);padding:10px 14px;text-align:left;color:var(--ink);animation:fadeUp .4s ease both}
.optl .sw{width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center}
.optl .sw svg{width:22px;height:22px;fill:none;stroke:var(--indigo);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.optl b{display:block;font-size:14.5px;font-weight:600}
.optl small{font-size:12px;color:var(--muted)}

/* resources */
.res{display:flex;flex-direction:column;gap:6px;background:var(--card);border-radius:20px;padding:14px 16px;text-align:left;color:var(--ink);animation:fadeUp .35s ease both;width:100%}
.res .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.res b{font-size:15px;line-height:1.3}
.res small{font-size:12px;color:var(--muted)}
.fmt{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;flex:0 0 auto}

/* buddy */
.shuffle{position:relative;height:220px;display:grid;place-items:center}
.shuffle .sc{position:absolute;width:150px;height:190px;border-radius:24px;background:var(--card);box-shadow:0 10px 24px rgba(42,26,110,.12);animation:shuf 1.2s ease-in-out infinite}
.shuffle .sc:nth-child(1){animation-delay:0s;background:var(--pink)}.shuffle .sc:nth-child(2){animation-delay:.4s;background:var(--sky)}.shuffle .sc:nth-child(3){animation-delay:.8s;background:var(--yellow)}
@keyframes shuf{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-70px) rotate(-10deg)}75%{transform:translateX(70px) rotate(10deg)}}
.bud{background:var(--card);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;animation:fadeUp .4s ease both}
.bud .who{display:flex;gap:12px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:600;color:var(--ink);flex:0 0 auto}
.bud b{font-size:17px}.bud small{font-size:12.5px;color:var(--muted)}
.itag{font-size:12px;font-weight:500;background:var(--pink);border-radius:999px;padding:4px 10px}
.itag.shared{background:var(--indigo);color:#fff}
.plane{width:90px;height:90px;margin:10px auto;animation:fly 2.2s ease-in-out infinite}
@keyframes fly{0%{transform:translate(-60px,20px) rotate(-8deg);opacity:0}30%{opacity:1}100%{transform:translate(70px,-50px) rotate(8deg);opacity:0}}
.confetti i{position:absolute;width:9px;height:14px;border-radius:3px;top:-20px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(760px) rotate(540deg)}}

/* workshop + calendar */
.ws{background:var(--card);border-radius:22px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;text-align:left;color:var(--ink);width:100%;animation:fadeUp .35s ease both}
.ws .date{width:52px;flex:0 0 auto;border-radius:14px;background:var(--yellow);text-align:center;padding:6px 0;font-weight:600;line-height:1.1}
.ws .date b{display:block;font-size:20px}.ws .date small{font-size:11px;text-transform:uppercase}
.ws strong{display:block;font-size:14.5px;line-height:1.3}
.ws span{font-size:12.5px;color:var(--muted)}
.ws .pick{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--lilac);color:var(--indigo);padding:3px 8px;border-radius:6px}
.calbox{position:relative;height:200px;display:grid;place-items:center}
.cal{width:170px;border-radius:22px;background:var(--card);overflow:hidden;box-shadow:0 14px 30px rgba(42,26,110,.15);animation:calIn .7s cubic-bezier(.3,.9,.4,1) both}
.cal .h{background:var(--indigo);color:#fff;font-size:12px;font-weight:600;padding:8px;text-align:center}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:10px}
.cal .g i{aspect-ratio:1;border-radius:6px;background:var(--paper)}
.cal .g i.hit{background:var(--yellow);animation:hit .6s ease .7s both}
@keyframes calIn{from{opacity:0;transform:translateY(-60px) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes hit{0%{transform:scale(1)}50%{transform:scale(1.6)}100%{transform:scale(1)}}
.evchip{position:absolute;bottom:6px;left:0;right:0;margin:0 auto;width:max-content;background:var(--indigo);color:#fff;font-size:12px;font-weight:500;padding:8px 12px;border-radius:999px;white-space:nowrap;animation:fadeUp .4s ease 1.1s both}

/* counsellor */
.slotgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slotgrid .chip{padding:0 6px;justify-content:center}
.ticket{position:relative;background:var(--card);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:6px;animation:ticket .7s cubic-bezier(.3,.9,.4,1) both}
.ticket:before,.ticket:after{content:"";position:absolute;top:58%;width:22px;height:22px;border-radius:50%;background:var(--sky)}
.ticket:before{left:-11px}.ticket:after{right:-11px}
.ticket hr{border:0;border-top:2px dashed var(--grey);margin:8px 0}
.ticket b{font-size:18px}
@keyframes ticket{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
.edit-note{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}

/* urgent */
.urgent-list{display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.45}
.urgent-list li{margin-left:18px}
.pill.call{background:var(--indigo)}
.pill.white{background:#fff;color:var(--indigo)}

/* follow-up */
.lock{flex:1;display:flex;flex-direction:column;align-items:center;padding:56px 18px 24px;gap:6px;color:#fff;background:radial-gradient(120% 80% at 50% 0%,#3A2A8A 0%,#1D1638 70%)}
.lock .clock{font-size:64px;font-weight:600;letter-spacing:-.02em;line-height:1}
.lock .day{font-size:14px;opacity:.85}
.notif{margin-top:40px;width:100%;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:center;text-align:left;color:#fff;animation:notif .6s cubic-bezier(.3,.9,.4,1) .6s both}
.notif .ap{width:38px;height:38px;border-radius:10px;background:var(--violet);display:grid;place-items:center;flex:0 0 auto}
.notif .ap i{width:12px;height:12px;border-radius:50%;background:#fff}
.notif b{font-size:13px;display:block}.notif span{font-size:13px;opacity:.9}
@keyframes notif{from{opacity:0;transform:translateY(-30px) scale(.96)}to{opacity:1;transform:none}}
.lock .hint{color:#fff;opacity:.75;margin-top:auto}
.path{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:28px}
.path:before{content:"";position:absolute;left:10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:rgba(42,26,110,.18)}
.wk{position:relative;background:var(--card);border-radius:18px;padding:12px 14px;animation:fadeUp .4s ease both}
.wk:before{content:"";position:absolute;left:-24px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 3px var(--indigo)}
.wk.done:before{background:var(--indigo)}
.wk.now:before{background:var(--violet);box-shadow:0 0 0 5px rgba(123,97,255,.25);animation:pulse 2.4s ease-in-out infinite}
.wk small{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--indigo)}
.wk p{font-size:14px}
.kit{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.kit>*{scroll-snap-align:start;flex:0 0 140px}
.kitem{border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--ink);min-height:150px}
.kitem .mini{border-radius:14px;overflow:hidden;aspect-ratio:300/246;background:rgba(255,255,255,.55)}
.kitem .mini svg{width:100%;height:100%}
.kitem b{font-size:13px;line-height:1.25}
.kitem.card q{font-size:13px;font-weight:600;line-height:1.35;quotes:none}

/* end */
.endwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:24px;position:relative;overflow:hidden}
.endwrap .row6{display:flex;gap:4px;align-items:flex-end;justify-content:center;width:100%}
.endwrap .row6>div{width:15%;animation:rise 1s cubic-bezier(.2,.8,.3,1) both}

/* v2.1: UX pass */
.exit{height:44px}
.chip{min-height:44px}
.link{min-height:44px}
.phone[data-bg="peach"]{background:#FFC79A}
.phone[data-bg="mist"]{background:#A9BDD6}
.phone[data-bg="white"]{background:#FFFFFF}
.phone[data-bg="peach"] .sub,.phone[data-bg="mist"] .sub{color:var(--muted-on)}
.phone[data-bg="white"] .qopt,.phone[data-bg="white"] .step,.phone[data-bg="white"] .plan,.phone[data-bg="white"] .field{background:var(--paper)}
.phone[data-bg="white"] .qopt.on,.phone[data-bg="white"] .step.on{background:var(--indigo)}
.phone[data-bg="white"] .pic.big,.phone[data-bg="white"] .evid{background:var(--paper)!important}
.lcard[style*="var(--card)"]{box-shadow:inset 0 0 0 2px var(--lilac)}
details.evid summary{cursor:pointer;list-style:none;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--indigo);display:flex;justify-content:space-between;align-items:center;min-height:28px}
details.evid summary::-webkit-details-marker{display:none}
details.evid summary:after{content:"+";font-size:18px;font-weight:500}
details.evid[open] summary:after{content:"\2212"}
details.evid[open] summary{margin-bottom:4px}
.phone[data-bg="white"] .meta span{background:var(--paper)}
.phone[data-bg="white"] .stepdots i:not(.on):not(.done){background:rgba(42,26,110,.18)}

/* v2.2: decision tree */
.phone[data-bg="stage"]{background:#E9E4F7}
.phone[data-bg="stage"] .sub{color:var(--muted-on)}
.tdot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 auto}
.tpanel{gap:6px}.tpanel h2{font-size:16px}
.tpanel .field{min-height:44px;padding:10px 12px;font-size:14px;background:var(--paper);border-width:1.5px}
.tpanel .qopt{background:var(--paper)}.tpanel .qopt.on{background:var(--indigo)}
.troot{background:var(--indigo);color:#fff;border-radius:18px;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.4;text-align:center;animation:fadeUp .4s ease both}
.tsvg{width:100%;height:44px;display:block;margin:-16px 0 -16px;overflow:visible}
.tbranch{fill:none;stroke:var(--indigo);stroke-width:3;stroke-linecap:round;stroke-dasharray:120;stroke-dashoffset:120;animation:tgrow .7s ease forwards;vector-effect:non-scaling-stroke}
@keyframes tgrow{to{stroke-dashoffset:0}}
.tcols{display:grid;gap:8px;align-items:start}
.tcol{display:flex;flex-direction:column;gap:6px;animation:fadeUp .45s ease both}
.tnode{border-radius:14px;padding:10px 8px;font-size:13px;font-weight:600;text-align:center;line-height:1.3;color:var(--ink)}
.tleaf{background:var(--card);border-radius:12px;padding:8px;font-size:12px;line-height:1.35;color:var(--ink)}

.tleaf.nx{box-shadow:inset 0 0 0 2px var(--indigo)}

/* v2.3: bottom navigation */
.tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px 14px 14px;background:var(--card);box-shadow:0 -1px 0 rgba(42,26,110,.08);position:relative;z-index:2}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;font-size:12px;font-weight:500;color:var(--muted);border-radius:16px;transition:color .2s}
.tab .ti{width:56px;height:32px;border-radius:999px;display:grid;place-items:center;transition:background .25s ease,transform .25s cubic-bezier(.3,.9,.4,1)}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--indigo);font-weight:600}
.tab.on .ti{background:var(--c);animation:tabpop .35s cubic-bezier(.3,.9,.4,1)}
.tab:active .ti{transform:scale(.92)}

.phone.has-tabs .toast{bottom:92px}
.phone.has-tabs .strip{margin-bottom:0}

.composer{display:flex;gap:8px;align-items:flex-end}

.composer .send{flex:0 0 auto;width:48px;height:48px;border-radius:50%;background:var(--indigo);color:var(--white);font-size:20px}

.rescard>span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.reslist{display:flex;flex-direction:column}

.wta{width:100%;border-radius:14px;border:2px solid var(--indigo);background:var(--card);padding:10px;font:inherit;font-size:14px;color:var(--ink);resize:vertical}

/* ---------- scaffold: questionnaires, survey, translation layer ---------- */
var SC_CFG=null, LC={'हिंदी':'hi','मराठी':'mr'}, CUR={hi:{},mr:{}}, MT={hi:{},mr:{}}, ORIG=new WeakMap(), ASKED={}, FAILS={};
function lc(){ return LC[S.lang]||'en'; }
function norm(s){ return s.replace(/\s+/g,' ').trim(); }
// English text of an element, even after it has been translated.
function enText(el){ var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT), n, o=''; while((n=w.nextNode())) o+=(ORIG.has(n)?ORIG.get(n):n.nodeValue)+' '; return norm(o); }
// Translation layer: reviewed phrases (lang/*.json) win; otherwise the server translates and caches. Questionnaires and the Urgent screen use reviewed phrases only. data-notr marks text never to translate.
function trTree(root){
  var l=lc(), w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), n, need={}, any=false;
  while((n=w.nextNode())){
    var p=n.parentElement; if(!p||p.closest('[data-notr],textarea,script,style,[data-act="lang"]')) continue;
    var en=ORIG.has(n)?ORIG.get(n):n.nodeValue, k=norm(en);
    if(l==='en'){ if(ORIG.has(n)) n.nodeValue=en; continue; }
    if(!/[A-Za-z]{2}/.test(k)) continue;
    ORIG.set(n,en);
    var t=CUR[l][k]||MT[l][k];
    if(t) n.nodeValue=en.match(/^\s*/)[0]+t+en.match(/\s*$/)[0];
    else if(!p.closest('[data-curated]') && cur!=='urgent' && !ASKED[l+'|'+k]){ need[k]=1; any=true; }
  }
  if(!any) return;
  var keys=Object.keys(need).slice(0,40); keys.forEach(function(k){ ASKED[l+'|'+k]=1; });
  fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang:l,strings:keys})})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){ Object.assign(MT[l],d.map||{}); if(root.isConnected) trTree(root); })
    .catch(function(){ var fc=0; keys.forEach(function(k){ var f=l+'|'+k; FAILS[f]=(FAILS[f]||0)+1; fc=Math.max(fc,FAILS[f]); });
      if(fc<4) setTimeout(function(){ keys.forEach(function(k){ delete ASKED[l+'|'+k]; }); if(root.isConnected && lc()===l) trTree(root); }, 15000*fc); });
}
new MutationObserver(function(ms){ if(lc()==='en') return; ms.forEach(function(m){ m.addedNodes.forEach(function(n){ var el=n.nodeType===1?n:n.parentElement; if(el) trTree(el); }); }); }).observe(phone,{childList:true,subtree:true});

function nextOffer(){
  var C=SC_CFG; if(!C) return null;
  if(C.placement.survey==='pathwayEnd' && !S.done.survey) return {kind:'survey',def:C.survey};
  if(C.placement.scales!=='pathwayEnd' || S.results.filter(function(r){return r.kind==='scale';}).length>=2) return null;
  var f=S.feelings, p=S.plate;
  var d=C.scales.filter(function(x){ return x.enabled && x.items.length && !S.done[x.id] && ((x.offer.feelings||[]).some(function(k){return f.indexOf(k)>-1;}) || (x.offer.plate||[]).some(function(k){return p.indexOf(k)>-1;})); })[0];
  return d?{kind:'scale',def:d}:null;

    var qq=S.sq, qd=qDef(qq.id), qv=+v; qq.ans.push(qv);
    if(qd.items[qq.idx].urgentOn && qd.items[qq.idx].urgentOn.indexOf(qv)>-1){ S.sq=null; cur='chat'; go('urgent'); return; }
    qq.idx++;
    if(qq.idx<qd.items.length) go('quiz',false);
    else { var rec={kind:qq.id==='survey'?'survey':'scale',id:qq.id,answers:qq.ans,date:Date.now()}; S.results.push(rec); S.done[qq.id]=1; S.lastRes=rec; S.sq=null; go(rec.kind==='survey'?'chat':'qres',false); }
  },
  send:function(){ sendMsg(); },
  resFilter:function(t,v){ S.resFilter=v; rerender(); },
  hoSend:function(){
    var hb={summary:{concern:val('hoWhat'),duration:val('hoLong'),tried:val('hoTried')}}, hc=document.getElementById('hoContact'); if(hc&&hc.checked) hb.contact=S.contact; var hr=document.getElementById('hoRes'); if(hr&&hr.checked) hb.results=S.results;
    fetch('/api/handoff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(hb)}).then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(d){ S.mine.push({id:d.id,summary:hb.summary}); go('sent'); })
      .catch(function(){ var m=document.getElementById('hoMsg'); if(m) m.textContent='That didn’t send. Please try again, or contact the counselling centre directly.'; });
  },
  del:function(t,v){
    var did=v==='code'?val('delCode'):v; if(!did) return;
    fetch('/api/handoff/'+encodeURIComponent(did),{method:'DELETE'}).then(function(r){ if(!r.ok) throw 0; S.mine=S.mine.filter(function(m){return m.id!==did;}); go('mydata',false); })
      .catch(function(){ var m=document.getElementById('delMsg'); if(m) m.textContent='Couldn’t find a note with that code.'; });
  },
  toast:function(t,v){ toast(v); },
  restart:function(){ var keepSnd=SND.on; S.feelings=[]; S.plate=[]; S.chat=[]; S.chatStage=0; S.introCard=0; S.q=[]; S.pr=[[],[],[]]; S.toolkit=[]; S.cards=[]; S.last=null; S.lastFb=null; S.useMode=null; S.couns={share:null,summary:'',day:null,slot:null,how:'In person'}; S.buddy={act:null,ints:[],time:null,idx:0,match:null,share:false}; S.wsAdded=[]; S.qtext=''; S.prNote=''; S.otherText=''; S.qi=0; S.breathDone=false; S.breathFrom='chat'; S.tab='talk'; S.p={}; S.resF='All'; S.resFilter='all'; S.seenFollow=false; S.slotOf={}; S.busy=false; S.aiHistory=[]; S.flow=null; S.tried=[]; S.results=[]; S.done={}; S.sq=null; S.lastRes=null; S.contact=null; S.mine=[]; hist=[]; cur=null; S.r={}; SND.on=keepSnd; go('arrive',false); }
};

phone.addEventListener('input', function(e){ if(e.target.id==='otherText') S.otherText=e.target.value; });
phone.addEventListener('keydown', function(e){ if(e.target.id==='compose' && e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); } });
phone.addEventListener('keydown', function(e){ if(e.key==='Enter' && e.target.id==='wIn'){ e.preventDefault(); ACT.wAdd(); } });
phone.addEventListener('click', function(e){
  var t=e.target.closest('[data-act]'); if(!t||t.disabled) return;
  if(t.tagName==='A') return;
  var a=t.dataset.act, v=t.dataset.v;
  if(ACT[a]) ACT[a](t,v);
});
phone.addEventListener('click', function(e){ if(e.target.closest('#cc')){ S.r.flip=!S.r.flip; document.getElementById('cc').classList.toggle('flip'); document.getElementById('cc').classList.remove('build'); } });

fetch('/api/health').then(function(r){return r.json();}).then(function(h){ S.serverOk=!!h.ai; }).catch(function(){});
fetch('/api/resources').then(function(r){return r.json();}).then(function(j){ SRES=j.resources||[]; }).catch(function(){});
fetch('/api/scales').then(function(r){return r.json();}).then(function(j){ SC_CFG=j; }).catch(function(){});
['hi','mr'].forEach(function(l){ fetch('lang/'+l+'.json').then(function(r){return r.json();}).then(function(j){ CUR[l]=j; }).catch(function(){}); });
var lm=location.search.match(/lang=(hi|mr)/); if(lm) S.lang={hi:'हिंदी',mr:'मराठी'}[lm[1]];
go('arrive', false);
})();

</script>
